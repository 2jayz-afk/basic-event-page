<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Event-Driven Webpage</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="pageContainer">
        <h1 id="mainHeading">Welcome to My Interactive Webpage</h1>

        <p>Enter your name below:</p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
        >

        <div class="buttonGroup">
            <button id="greetingButton">Display Greeting</button>
            <button id="backgroundButton">Change Background</button>
            <button id="resetButton">Reset</button>
        </div>

        <p id="messageArea"></p>

        <section class="studentInfo">
            <h2>Student Information</h2>
            <p><strong>Name:</strong> Your Name</p>
            <p><strong>Course:</strong> Your Course</p>
            <p><strong>Section:</strong> Your Section</p>
            <p><strong>Activity Date:</strong> September 11, 2026</p>
        </section>
    </div>
</body>
</html>
